<!DOCTYPE html><html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>CompraSmart - Ofertas y Productos Recomendados</title>

<link rel="stylesheet" href="styles.css">

</head><body><!-- ============================= -->
<!-- NAVBAR -->
<!-- ============================= -->

<header class="header">

    <div class="container header-top">

        <a class="logo" href="#">
            CompraSmart
        </a>

        <form class="search" id="searchForm">

            <input
                type="text"
                id="searchInput"
                placeholder="Buscar productos, marcas y más..."
                aria-label="Buscar"
            >

            <button
                type="submit"
                class="search-btn"
                aria-label="Buscar"
            >
                🔍
            </button>

        </form>

        <button
            class="menu"
            aria-label="Abrir menú"
            type="button"
        >
            ☰
        </button>

    </div>


    <div class="container header-bottom">

        <nav class="nav-links">

            <a href="#ofertas" class="active">
                Ofertas
            </a>

            <a href="#categorias">
                Categorías
            </a>

            <a href="#comparativas">
                Comparativas
            </a>

        </nav>

    </div>

</header>


<!-- ============================= -->
<!-- CONTENIDO PRINCIPAL -->
<!-- ============================= -->

<main>

    <!-- HERO -->

    <section class="hero">

        <div class="container">

            <div class="quick-tags">

                <span>Buscar:</span>

                <button type="button" data-category="Audio">
                    Audio
                </button>

                <button type="button" data-category="Celulares">
                    Celulares
                </button>

                <button type="button" data-category="Hogar">
                    Hogar
                </button>

                <button type="button" data-category="Informática">
                    Informática
                </button>

                <button type="button" data-category="Herramientas">
                    Herramientas
                </button>

                <button type="button" data-category="Belleza">
                    Belleza
                </button>

            </div>

        </div>

    </section>


    <!-- ============================= -->
    <!-- PRODUCTOS -->
    <!-- ============================= -->

    <section
        class="section"
        id="ofertas"
    >

        <div class="container">

            <div class="section-head">

                <h2>
                    Productos recomendados
                </h2>

                <span
                    class="count"
                    id="productCount"
                >
                    Cargando productos...
                </span>

            </div>


            <!--
                IMPORTANTE:
                JavaScript coloca TODOS los productos aquí.
            -->

            <div
                class="product-grid"
                id="products"
            ></div>


            <!-- MENSAJE SI NO HAY RESULTADOS -->

            <div
                id="noResults"
                style="display:none; text-align:center; padding:40px 20px;"
            >

                <h3>
                    No encontramos productos
                </h3>

                <p>
                    Probá con otro nombre o categoría.
                </p>

            </div>

        </div>

    </section>


    <!-- ============================= -->
    <!-- CATEGORÍAS -->
    <!-- ============================= -->

    <section
        class="section"
        id="categorias"
    >

        <div class="container">

            <div class="section-head">

                <h2>
                    Categorías
                </h2>

            </div>

            <div class="quick-tags">

                <button type="button" data-category="Audio">
                    🎧 Audio
                </button>

                <button type="button" data-category="Celulares">
                    📱 Celulares
                </button>

                <button type="button" data-category="Gaming">
                    🎮 Gaming
                </button>

                <button type="button" data-category="Hogar">
                    🏠 Hogar
                </button>

                <button type="button" data-category="Informática">
                    💻 Informática
                </button>

                <button type="button" data-category="Herramientas">
                    🔧 Herramientas
                </button>

                <button type="button" data-category="Belleza">
                    🧴 Belleza
                </button>

                <button type="button" data-category="Seguridad">
                    📷 Seguridad
                </button>

                <button type="button" data-category="Tecnología">
                    🛰️ Tecnología
                </button>

                <button type="button" data-category="Juguetes">
                    🧸 Juguetes
                </button>

            </div>

        </div>

    </section>


    <!-- ============================= -->
    <!-- COMPARATIVAS -->
    <!-- ============================= -->

    <section
        class="section"
        id="comparativas"
    >

        <div class="container">

            <div class="section-head">

                <h2>
                    Comparativas
                </h2>

            </div>

            <p>
                Próximamente vas a poder comparar productos
                y encontrar la mejor opción.
            </p>

        </div>

    </section>

</main>


<!-- ============================= -->
<!-- JAVASCRIPT -->
<!-- ============================= -->

<!--
    Este archivo debe contener la lista
    completa de los 34 productos.
-->

<script src="products.js"></script>


<script>

    document.addEventListener("DOMContentLoaded", () => {

        /*
         * ============================
         * MENÚ MÓVIL
         * ============================
         */

        const menuBtn =
            document.querySelector(".menu");

        const navLinks =
            document.querySelector(".header-bottom");


        if (menuBtn && navLinks) {

            menuBtn.addEventListener("click", () => {

                navLinks.classList.toggle("open");

            });

        }


        /*
         * ============================
         * BUSCADOR
         * ============================
         */

        const searchForm =
            document.querySelector("#searchForm");

        const searchInput =
            document.querySelector("#searchInput");


        if (searchForm && searchInput) {

            searchForm.addEventListener(
                "submit",
                (event) => {

                    event.preventDefault();

                    const text =
                        searchInput.value
                        .trim()
                        .toLowerCase();


                    if (!text) {

                        renderProducts(products);

                        return;

                    }


                    const filtered =
                        products.filter(product => {

                            return (

                                product.name
                                    .toLowerCase()
                                    .includes(text)

                                ||

                                product.desc
                                    .toLowerCase()
                                    .includes(text)

                                ||

                                product.cat
                                    .toLowerCase()
                                    .includes(text)

                            );

                        });


                    renderProducts(filtered);


                    const noResults =
                        document.querySelector("#noResults");


                    if (noResults) {

                        noResults.style.display =
                            filtered.length === 0
                                ? "block"
                                : "none";

                    }

                }
            );

        }


        /*
         * ============================
         * CATEGORÍAS
         * ============================
         */

        const categoryButtons =
            document.querySelectorAll(
                "[data-category]"
            );


        categoryButtons.forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const category =
                        button.dataset.category;


                    const filtered =
                        products.filter(product => {

                            return product.cat === category;

                        });


                    renderProducts(filtered);


                    const noResults =
                        document.querySelector("#noResults");


                    if (noResults) {

                        noResults.style.display =
                            filtered.length === 0
                                ? "block"
                                : "none";

                    }


                    const productsSection =
                        document.querySelector("#ofertas");


                    if (productsSection) {

                        productsSection.scrollIntoView({
                            behavior: "smooth"
                        });

                    }

                }
            );

        });


        /*
         * ============================
         * MOSTRAR TODOS LOS PRODUCTOS
         * ============================
         */

        if (
            typeof products !== "undefined" &&
            typeof renderProducts === "function"
        ) {

            renderProducts(products);


            const productCount =
                document.querySelector("#productCount");


            if (productCount) {

                productCount.textContent =
                    products.length +
                    " productos";

            }

        } else {

            console.error(
                "No se encontró products.js o la variable products."
            );


            const container =
                document.querySelector("#products");


            if (container) {

                container.innerHTML = `
                    <p style="
                        grid-column:1/-1;
                        text-align:center;
                        padding:40px;
                    ">
                        No se pudieron cargar los productos.
                    </p>
                `;

            }

        }

    });

</script>

</body>
    </html>
