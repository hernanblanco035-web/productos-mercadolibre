/* ==============================
   CREAR TARJETA
   ============================== */

function createProductCard(product) {

    const safeName =
        product.name
        .replace(/"/g, "&quot;");

    const safeDesc =
        product.desc
        .replace(/"/g, "&quot;");

    const emoji =
        product.icon || "🛍️";

    return `

        <article class="product">

            <div class="product-img">

                <!-- EMOJI DE RESPALDO -->
                <div
                    class="product-emoji"
                    id="emoji-${encodeURIComponent(product.url)}"
                >
                    ${emoji}
                </div>

                <!-- IMAGEN REAL -->
                <img
                    src=""
                    data-product-url="${product.url}"
                    data-emoji-id="emoji-${encodeURIComponent(product.url)}"
                    alt="${safeName}"
                    loading="lazy"
                    style="display:none;"
                >

            </div>

            <div class="product-body">

                <span class="tag-promo">
                    ${product.cat}
                </span>

                <h3>
                    ${product.name}
                </h3>

                <p class="product-desc">
                    ${safeDesc}
                </p>

                <div class="price-container">

                    <span class="price">
                        ${product.price}
                    </span>

                </div>

                <span class="envio-gratis">
                    Producto recomendado
                </span>

                <a
                    href="${product.url}"
                    target="_blank"
                    rel="noopener noreferrer sponsored"
                    class="cta-link"
                >
                    Ver en Mercado Libre
                </a>

            </div>

        </article>

    `;
}


/* ==============================
   CARGAR IMAGEN
   ============================== */

function loadProductImage(img) {

    const productUrl =
        img.dataset.productUrl;

    const emoji =
        document.getElementById(
            img.dataset.emojiId
        );

    if (!productUrl) {
        return;
    }

    const workerImage =
        `/api/product-image?url=${encodeURIComponent(productUrl)}`;

    img.onload = function() {

        /*
         * Si la imagen se carga correctamente:
         * ocultamos el emoji.
         */

        img.style.display = "block";

        if (emoji) {
            emoji.classList.add("hidden");
        }

    };


    img.onerror = function() {

        /*
         * Si la imagen falla:
         * dejamos visible el emoji.
         */

        img.style.display = "none";

        if (emoji) {
            emoji.classList.remove("hidden");
        }

    };


    /*
     * IMPORTANTE:
     * El producto ya está en pantalla
     * antes de intentar cargar la imagen.
     */

    img.src = workerImage;
}


/* ==============================
   MOSTRAR PRODUCTOS
   ============================== */

function renderProducts(list = products) {

    const container =
        document.querySelector("#products");

    if (!container) {
        return;
    }


    /*
     * PRIMERO:
     * mostramos TODOS los productos.
     */

    container.innerHTML =
        list
        .map(product => createProductCard(product))
        .join("");


    /*
     * DESPUÉS:
     * intentamos cargar las imágenes.
     */

    const images =
        container.querySelectorAll(
            "img[data-product-url]"
        );


    images.forEach(img => {

        loadProductImage(img);

    });


    /*
     * CONTADOR
     */

    const count =
        document.querySelector("#productCount");

    if (count) {

        count.textContent =
            list.length +
            (list.length === 1
                ? " producto"
                : " productos");

    }


    /*
     * SIN RESULTADOS
     */

    const noResults =
        document.querySelector("#noResults");

    if (noResults) {

        noResults.style.display =
            list.length === 0
                ? "block"
                : "none";

    }

}


/* ==============================
   VARIABLES GLOBALES
   ============================== */

window.products =
    products;

window.renderProducts =
    renderProducts;
