<!-- NAVBAR -->
<!-- ============================= -->

<header class="header">

            CompraSmart

        <nav class="nav-links">

                Ofertas
            </a>

                Categorías

                Comparativas
            </a>

        </nav>

</header>


<!-- ============================= -->
<!-- CONTENIDO PRINCIPAL -->
<!-- ============================= -->

<main>

    <!-- HERO -->

    <section class="hero">

        <div class="container">

            <div class="quick-tags">

                <span>Buscar:</span>

                <button type="button" data-category="Audio">
                    Audio
                </button>

                <button type="button" data-category="Celulares">
                    Celulares
                </button>

                <button type="button" data-category="Hogar">
                    Hogar
                </button>

                <button type="button" data-category="Informática">
                    Informática
                </button>

                <button type="button" data-category="Herramientas">
                    Herramientas
                </button>

                <button type="button" data-category="Belleza">
                    Belleza
                </button>

            </div>

        </div>

    </section>


    <!-- ============================= -->
    <!-- PRODUCTOS -->
    <!-- ============================= -->

    <section
        class="section"
        id="ofertas"
    >

        <div class="container">

            <div class="section-head">

                <h2>
                    Productos recomendados
                </h2>

                <span
                    class="count"
                    id="productCount"
                >
                    Cargando productos...
                </span>

            </div>


            <!--
                IMPORTANTE:
                JavaScript coloca TODOS los productos aquí.
            -->

            <div
                class="product-grid"
                id="products"
            ></div>


            <!-- MENSAJE SI NO HAY RESULTADOS -->

            <div
                id="noResults"
                style="display:none; text-align:center; padding:40px 20px;"
            >

                <h3>
                    No encontramos productos
                </h3>

                <p>
                    Probá con otro nombre o categoría.
                </p>

            </div>

        </div>

    </section>


    <!-- ============================= -->
    <!-- CATEGORÍAS -->
    <!-- ============================= -->

    <section
        class="section"
        id="categorias"
    >

        <div class="container">

            <div class="section-head">

                <h2>
                    Categorías
                </h2>

            </div>

            <div class="quick-tags">

                <button type="button" data-category="Audio">
                    🎧 Audio
                </button>

                <button type="button" data-category="Celulares">
                    📱 Celulares
                </button>

                <button type="button" data-category="Gaming">
                    🎮 Gaming
                </button>

                <button type="button" data-category="Hogar">
                    🏠 Hogar
                </button>

                <button type="button" data-category="Informática">
                    💻 Informática
                </button>

                <button type="button" data-category="Herramientas">
                    🔧 Herramientas
                </button>

                <button type="button" data-category="Belleza">
                    🧴 Belleza
                </button>

                <button type="button" data-category="Seguridad">
                    📷 Seguridad
                </button>

                <button type="button" data-category="Tecnología">
                    🛰️ Tecnología
                </button>

                <button type="button" data-category="Juguetes">
                    🧸 Juguetes
                </button>

            </div>

        </div>

    </section>


    <!-- ============================= -->
    <!-- COMPARATIVAS -->
    <!-- ============================= -->

    <section
        class="section"
        id="comparativas"
    >

        <div class="container">

            <div class="section-head">

                <h2>
                    Comparativas
                </h2>

            </div>

            <p>
                Próximamente vas a poder comparar productos
                y encontrar la mejor opción.
            </p>

        </div>

    </section>

</main>

      {name:"Colchón en Caja YOLO by Simmons 2 Plazas 190x140",cat:"Hogar",price:"$414.427",icon:"🛏️",desc:"Colchón YOLO by Simmons de 2 plazas.",url:"https://meli.la/2aDf1kN"},
      {name:"Protector Solar L'Oréal Paris UV Defender FPS50+ Tono Claro 40ml",cat:"Belleza",price:"$34.557",icon:"☀️",desc:"Protector solar facial UV Defender FPS50+.",url:"https://meli.la/2f8zHHP"},
      {name:"Afeitadora Eléctrica Hombre Shaver VGR V-325 Recargable",cat:"Belleza",price:"$45.590",icon:"🪒",desc:"Afeitadora VGR V-325 inalámbrica y recargable.",url:"https://meli.la/1yiuPkC"}
    ];

    function getFallbackImage(product) {
        return `https://placehold.co/600x600?text=${encodeURIComponent(product.icon)}`;
    }

    function createProductCard(product, image = getFallbackImage(product)) {
        return `
            <article class="product">
                <div class="product-img">
                    <img src="${image}" alt="${product.name}" loading="lazy" style="width:100%;height:100%;object-fit:contain;" onerror="this.onerror=null;this.src='${getFallbackImage(product)}'">
                </div>
                <div class="product-body">
                    <span class="tag-promo">${product.cat}</span>
                    <h3>${product.name}</h3>
                    <p class="product-desc">${product.desc}</p>
                    <div class="price-container"><span class="price">${product.price}</span></div>
                    <span class="envio-gratis">Producto recomendado</span>
                    <a href="${product.url}" target="_blank" rel="noopener noreferrer sponsored" class="cta-link">Ver en Mercado Libre</a>
                </div>
            </article>
        `;
    }

    function renderProducts(list = products) {
        const container = document.querySelector("#products");
        if (!container) return;

        container.innerHTML = list.map(product => createProductCard(product)).join("");

        const count = document.querySelector("#productCount");
        if (count) count.textContent = list.length + " productos";

        const noResults = document.querySelector("#noResults");
        if (noResults) noResults.style.display = list.length === 0 ? "block" : "none";
    }

    window.products = products;
    window.renderProducts = renderProducts;
</script>


<script>

    document.addEventListener("DOMContentLoaded", () => {

        /*
         * ============================
         * MENÚ MÓVIL
         * ============================
         */

        const menuBtn =
            document.querySelector(".menu");

        const navLinks =
            document.querySelector(".header-bottom");


        if (menuBtn && navLinks) {

            menuBtn.addEventListener("click", () => {

                navLinks.classList.toggle("open");

            });

        }


        /*
         * ============================
         * BUSCADOR
         * ============================
         */

        const searchForm =
            document.querySelector("#searchForm");

        const searchInput =
            document.querySelector("#searchInput");


        if (searchForm && searchInput) {

            searchForm.addEventListener(
                "submit",
                (event) => {

                    event.preventDefault();

                    const text =
                        searchInput.value
                        .trim()
                        .toLowerCase();


                    if (!text) {

                        renderProducts(products);

                        return;

                    }


                    const filtered =
                        products.filter(product => {

                            return (

                                product.name
                                    .toLowerCase()
                                    .includes(text)

                                ||

                                product.desc
                                    .toLowerCase()
                                    .includes(text)

                                ||

                                product.cat
                                    .toLowerCase()
                                    .includes(text)

                            );

                        });


                    renderProducts(filtered);


                    const noResults =
                        document.querySelector("#noResults");


                    if (noResults) {

                        noResults.style.display =
                            filtered.length === 0
                                ? "block"
                                : "none";

                    }

                }
            );

        }


        /*
         * ============================
         * CATEGORÍAS
         * ============================
         */

        const categoryButtons =
            document.querySelectorAll(
                "[data-category]"
            );


        categoryButtons.forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const category =
                        button.dataset.category;


                    const filtered =
                        products.filter(product => {

                            return product.cat === category;

                        });


                    renderProducts(filtered);


                    const noResults =
                        document.querySelector("#noResults");


                    if (noResults) {

                        noResults.style.display =
                            filtered.length === 0
                                ? "block"
                                : "none";

                    }


                    const productsSection =
                        document.querySelector("#ofertas");


                    if (productsSection) {

                        productsSection.scrollIntoView({
                            behavior: "smooth"
                        });

                    }

                }
            );

        });


        /*
         * ============================
         * MOSTRAR TODOS LOS PRODUCTOS
         * ============================
         */

        if (
            typeof products !== "undefined" &&
            typeof renderProducts === "function"
        ) {

            renderProducts(products);


            const productCount =
                document.querySelector("#productCount");


            if (productCount) {

                productCount.textContent =
                    products.length +
                    " productos";

            }

        } else {

            console.error(
                "No se encontró products.js o la variable products."
            );


            const container =
                document.querySelector("#products");


            if (container) {

                container.innerHTML = `
                    <p style="
                        grid-column:1/-1;
                        text-align:center;
                        padding:40px;
                    ">
                        No se pudieron cargar los productos.
                    </p>
                `;

            }

        }

    });

</script>
